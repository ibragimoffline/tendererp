<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tender ERP</title>
    <!-- MAVZU BO'YOQDAN OLDIN qo'yiladi. React ishga tushguncha sahifa
         yorug' bo'lib bir chaqnab olardi ("flash of wrong theme") —
         qorong'i mavzuda bu ko'zni og'ritadi. Skript ATAYLAB inline va
         `<head>` ichida: tashqi fayl kechikadi. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('erp.theme') || 'system'
          var dark = t === 'dark' || (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) { /* xususiy oyna — yorug' bo'yicha ishlaymiz */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
